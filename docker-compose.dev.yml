services:
  backend:
    build: ./backend
    command: uvicorn src.app:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
      - backend-storage:/backend/storage
    env_file: ".env.dev"
    ports:
      - "8000:8000"
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy

  backend-worker:
    build: ./backend
    command: [ "celery", "-A", "src.infrastructure.queue.celery_app:celery_app", "worker", "-l", "info" ]
    container_name: backend-worker
    env_file: ".env.dev"
    volumes:
      - ./backend:/backend
      # The worker reads the bytes the API wrote, so both must see the same
      # storage volume.
      - backend-storage:/backend/storage
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy

  backend-db:
    image: postgres:17
    container_name: backend-db
    ports:
      - "5433:5433"
    env_file: ".env.dev"
    environment:
      # Without PGDATA pointing inside the mount, the volume holds nothing and
      # the database is recreated empty on every restart.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - backend-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}" ]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-redis:
    image: redis:7-alpine
    container_name: backend-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-db-volume:
  backend-storage:
